version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: perfume_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: perfume_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: perfume_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: perfume_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/perfume_tracker
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    container_name: perfume_scraper
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/perfume_tracker
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./scrapers:/app/scrapers
      - ./scheduler:/app/scheduler
    depends_on:
      - postgres
      - redis
    command: celery -A scheduler.celery_app worker --loglevel=info

volumes:
  postgres_data:
